# /etc/systemd/system/iceccd.service.d/scheduler.conf
# SPDX-License-Identifier: MIT
# Copyright (C) 2026 Igalia S.L.
# Pick the scheduler host at every (re)start and hand it to the wrapper
# through the environment. The wrapper only adds --scheduler-host when
# ICECC_SCHEDULER_HOST is non-empty, so an empty value means "broadcast".
# NOTE: ICECC_SCHEDULER_HOST must stay commented out in /etc/icecc/icecc.conf,
# otherwise that file (sourced by the wrapper) would override this value.
[Service]
ExecStartPre=/usr/local/sbin/icecc-pick-scheduler
EnvironmentFile=-/run/iceccd-scheduler.env
